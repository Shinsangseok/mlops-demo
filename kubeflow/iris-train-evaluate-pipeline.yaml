# PIPELINE DEFINITION
# Name: iris-train-evaluate-pipeline
# Outputs:
#    Output: float
components:
  comp-evaluate-model:
    executorLabel: exec-evaluate-model
    inputDefinitions:
      artifacts:
        model_artifact:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        test_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      parameters:
        Output:
          parameterType: NUMBER_DOUBLE
  comp-train-model-v2:
    executorLabel: exec-train-model-v2
    outputDefinitions:
      artifacts:
        model_artifact:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        test_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-evaluate-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'scikit-learn==1.5.2'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate_model(\n    model_artifact: dsl.Input[dsl.Model], \n\
          \    test_data: dsl.Input[dsl.Dataset]\n) -> float: \n    import joblib\
          \ \n    import numpy as np \n    from sklearn.metrics import accuracy_score\
          \ \n\n    # 1. \uC55E \uB2E8\uACC4\uC5D0\uC11C \uC9C0\uC815\uD55C \uBAA8\
          \uB378 \uBD88\uB7EC\uC624\uAE30 \n    model = joblib.load(model_artifact.path)\
          \ \n\n    # 2. \uD14C\uC2A4\uD2B8 \uB370\uC774\uD130 \uBD88\uB7EC\uC624\uAE30\
          \ \n    with np.load(test_data.path) as data: \n        X_test = data[\"\
          X_test\"]\n        y_test = data[\"y_test\"]\n\n    # 3. \uBAA8\uB378 \uC608\
          \uCE21 \n    predictions = model.predict(X_test) \n\n    # 4. \uC815\uD655\
          \uB3C4 \uACC4\uC0B0 \n    accuracy = accuracy_score(y_test, predictions)\
          \ \n\n    print(\"\uBAA8\uB378 \uC815\uD655\uB3C4:\", accuracy) \n\n   \
          \ return float(accuracy) \n\n"
        image: python:3.11-slim
    exec-train-model-v2:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_model_v2
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'scikit-learn==1.5.2'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_model_v2(\n    model_artifact: dsl.Output[dsl.Model], \n\
          \    test_data: dsl.Output[dsl.Dataset]\n): \n    import joblib \n    import\
          \ numpy as np \n\n    from sklearn.datasets import load_iris \n    from\
          \ sklearn.model_selection import train_test_split \n    from sklearn.ensemble\
          \ import RandomForestClassifier \n\n    # 1. Iris \uB370\uC774\uD130 \uBD88\
          \uB7EC\uC624\uAE30 \n    iris = load_iris() \n\n    X_train, X_test, y_train,\
          \ y_test = train_test_split( \n        iris.data, \n        iris.target,\
          \ \n        test_size=0.2, \n        random_state=42\n    ) \n\n    # 3.\
          \ RandomForest \uBAA8\uB378 \uC0DD\uC131 \n    model = RandomForestClassifier(\
          \ \n        n_estimators=100, \n        random_state=42\n    ) \n\n    #\
          \ 4. \uBAA8\uB378 \uD559\uC2B5 \n    model.fit(X_train, y_train) \n\n  \
          \  # 5. \uD559\uC2B5\uD55C \uBAA8\uB378 \uD30C\uC77C \uC800\uC7A5 \n   \
          \ joblib.dump(model, model_artifact.path) \n\n    # 6. \uD14C\uC2A4\uD2B8\
          \ \uB370\uC774\uD130 \uC800\uC7A5 \n    with open(test_data.path, \"wb\"\
          ) as f: \n        np.savez(\n            f, \n            X_test=X_test,\
          \ \n            y_test=y_test\n        ) \n\n    print(\"RandomForest \uD559\
          \uC2B5 \uC644\uB8CC!\") \n    print(\"\uD559\uC2B5 \uB370\uC774\uD130:\"\
          , len(X_train)) \n    print(\"\uD14C\uC2A4\uD2B8 \uB370\uC774\uD130:\",\
          \ len(X_test)) \n    print(\"\uBAA8\uB378 \uD30C\uC77C \uC800\uC7A5 \uC644\
          \uB8CC!\") \n\n"
        image: python:3.11-slim
pipelineInfo:
  name: iris-train-evaluate-pipeline
root:
  dag:
    outputs:
      parameters:
        Output:
          valueFromParameter:
            outputParameterKey: Output
            producerSubtask: evaluate-model
    tasks:
      evaluate-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate-model
        dependentTasks:
        - train-model-v2
        inputs:
          artifacts:
            model_artifact:
              taskOutputArtifact:
                outputArtifactKey: model_artifact
                producerTask: train-model-v2
            test_data:
              taskOutputArtifact:
                outputArtifactKey: test_data
                producerTask: train-model-v2
        taskInfo:
          name: evaluate-model
      train-model-v2:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-model-v2
        taskInfo:
          name: train-model-v2
  outputDefinitions:
    parameters:
      Output:
        parameterType: NUMBER_DOUBLE
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
