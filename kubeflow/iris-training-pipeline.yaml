# PIPELINE DEFINITION
# Name: iris-training-pipeline
# Outputs:
#    Output: float
components:
  comp-train-model:
    executorLabel: exec-train-model
    outputDefinitions:
      parameters:
        Output:
          parameterType: NUMBER_DOUBLE
deploymentSpec:
  executors:
    exec-train-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'scikit-learn==1.5.2'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_model() -> float: \n    from sklearn.datasets import load_iris\
          \ \n    from sklearn.model_selection import train_test_split \n    from\
          \ sklearn.ensemble import RandomForestClassifier \n    from sklearn.metrics\
          \ import accuracy_score \n\n    # 1. Iris \uB370\uC774\uD130 \uBD88\uB7EC\
          \uC624\uAE30 \n    iris = load_iris() \n\n    # 2. \uD559\uC2B5\uC6A9\uACFC\
          \ \uD3C9\uAC00\uC6A9 \uB370\uC774\uD130 \uBD84\uB9AC \n    X_train, X_test,\
          \ y_train, y_test = train_test_split(\n        iris.data, \n        iris.target,\
          \ \n        test_size=0.2, \n        random_state=42 \n    ) \n\n    # 3.\
          \ RandomForest \uBAA8\uB378 \uC0DD\uC131 \n    model = RandomForestClassifier(\
          \ \n        n_estimators=100, \n        random_state=42\n    ) \n\n    #\
          \ 4. \uBAA8\uB378 \uD559\uC2B5 \n    model.fit(X_train, y_train) \n\n  \
          \  # 5. \uC608\uCE21 \uBC0F \uC815\uD655\uB3C4 \uD3C9\uAC00 \n    predictions\
          \ = model.predict(X_test) \n    accuracy = accuracy_score(y_test, predictions)\
          \ \n\n    print(\"\uBAA8\uB378 \uC815\uD655\uB3C4:\", accuracy) \n\n   \
          \ return float(accuracy) \n\n"
        image: python:3.11-slim
pipelineInfo:
  name: iris-training-pipeline
root:
  dag:
    outputs:
      parameters:
        Output:
          valueFromParameter:
            outputParameterKey: Output
            producerSubtask: train-model
    tasks:
      train-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-model
        taskInfo:
          name: train-model
  outputDefinitions:
    parameters:
      Output:
        parameterType: NUMBER_DOUBLE
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
