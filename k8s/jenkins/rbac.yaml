apiVersion: rbac.authorization.k8s.io/v1
kind: Role 
metadata: 
  name: jenkins-agent-manager 
  namespace: jenkins 
rules: 
  - apiGroups: [""]
    resources: 
      - pods 
      - pods/log 
      - pods/exec
      - events 
      - secrets
      - configmaps
    verbs: 
      - get
      - list
      - watch 
      - create
      - delete
      - patch 
      - update 


---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: 
  name: jenkins-agent-manager 
  namespace: jenkins 
subjects: 
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins
roleRef: 
  kind: Role 
  name: jenkins-agent-manager
  apiGroup: rbac.authorization.k8s.io
