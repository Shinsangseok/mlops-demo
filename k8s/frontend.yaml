apiVersion: apps/v1
kind: Deployment

metadata:
  labels:
    app: frontend
  name: frontend
  namespace: service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001

      containers:
      - image: myregistry.com/frontend:v2
        name: frontend

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true

        env:
        - name: API_URL
          valueFrom:
            configMapKeyRef:
              name: api-url
              key: url

        - name: HOME
          value: /tmp

        volumeMounts:
        - name: tmp
          mountPath: /tmp

      volumes:
      - name: tmp
        emptyDir: {}

      imagePullSecrets:
      - name: regcred
